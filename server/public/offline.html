<!DOCTYPE html>
<!--
  Страница, которую показывает service worker (public/sw.js), когда сети нет
  вовсе. Самостоятельная: ни стилей, ни скриптов снаружи — за ними пришлось бы
  идти в ту самую сеть, которой нет. Языки сайта без словаря: язык берётся
  у браузера, строк здесь три.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takebana</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    box-sizing: border-box;
    background: #0A0A0A;
    color: #F5F1EA;
    font-family: Helvetica, Arial, sans-serif;
    text-align: center;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -.01em; }
  p { margin: 0; max-width: 32ch; font-size: 14px; color: rgba(245, 241, 234, .65); line-height: 1.5; }
  button {
    margin-top: 6px;
    padding: 11px 26px;
    background: #E34234;
    border: 0;
    color: #F5F1EA;
    font: inherit;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    cursor: pointer;
  }
</style>
</head>
<body>
  <img src="/img/app/icon-192.png?v=2" alt="Takebana" width="64" height="64">
  <h1 id="head">Нет связи</h1>
  <p id="text">Страница откроется, как только вернётся интернет.</p>
  <button id="again" onclick="location.reload()">Повторить</button>
<script>
  // Строки на языках сайта, кроме русского — он уже в разметке (utils/langs.js).
  var T = {
    en: ['No connection', 'The page will open as soon as the internet is back.', 'Try again'],
    es: ['Sin conexión', 'La página se abrirá en cuanto vuelva internet.', 'Reintentar'],
    pt: ['Sem conexão', 'A página abre assim que a internet voltar.', 'Tentar de novo']
  };
  var lang = (navigator.language || '').slice(0, 2).toLowerCase();
  if (lang !== 'ru') {
    if (!T[lang]) lang = 'en';
    document.documentElement.lang = lang;
    document.getElementById('head').textContent = T[lang][0];
    document.getElementById('text').textContent = T[lang][1];
    document.getElementById('again').textContent = T[lang][2];
  }
  // Сеть вернулась сама — не заставляем нажимать кнопку.
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
