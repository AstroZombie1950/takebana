<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Проверка связи</title>
<!-- ВРЕМЕННО: проверка своего TURN, см. routes/turnProbe.js -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0b0b0b; color: #f5f1ea; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: #b9b2a6; }
  button { padding: 12px 20px; font: inherit; font-weight: 600; background: #7aa874; color: #0b0b0b; border: 0; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  video { display: block; width: 100%; max-width: 320px; aspect-ratio: 16 / 9; margin: 12px 0; background: #222; }
  pre { margin: 12px 0 0; padding: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-word; background: #1a1a1a; }
</style>
</head>
<body>
<main>
  <h1>Проверка связи для звонков</h1>
  <p>Около пяти минут. VPN выключите, вкладку не закрывайте и не сворачивайте. Итог уйдёт нам сам.</p>
  <button id="go" type="button">Начать</button>
  <video id="peek" muted playsinline autoplay></video>
  <pre id="out"></pre>
</main>
<script>
(function () {
  'use strict';
  // Для каждого пути (UDP, TCP, TLS) — две RTCPeerConnection в этой же
  // вкладке, обе только через наш TURN (relay). Поток уходит от телефона
  // на сервер и возвращается обратно — ровно тот участок сети, который
  // режет провайдер. Картинка шумная нарочно: пустой кадр сжимается в
  // ноль, а проверять надо поток, похожий на живое видео.
  var TEST_S = 60, STEP_S = 5, CONNECT_S = 15;
  var out = document.getElementById('out');
  var peek = document.getElementById('peek');
  var lines = [];
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function log(s) { lines.push(s); out.textContent = lines.join('\n'); }

  function source() {
    var cv = document.createElement('canvas');
    cv.width = 640; cv.height = 360;
    var g = cv.getContext('2d');
    var n = 0;
    setInterval(function () {
      for (var i = 0; i < 60; i++) {
        g.fillStyle = 'hsl(' + ((Math.random() * 360) | 0) + ',70%,50%)';
        g.fillRect(Math.random() * 640, Math.random() * 360, 20 + Math.random() * 80, 20 + Math.random() * 80);
      }
      g.fillStyle = '#000'; g.fillRect(0, 0, 140, 36);
      g.fillStyle = '#fff'; g.font = '24px monospace'; g.fillText(String(n++), 8, 27);
    }, 33);
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ac.createOscillator();
    var dst = ac.createMediaStreamDestination();
    osc.connect(dst); osc.start();
    var s = cv.captureStream(30);
    s.addTrack(dst.stream.getAudioTracks()[0]);
    return s;
  }

  async function stats(pc) {
    var r = { video: 0, audio: 0, frames: 0, rtt: null, via: '' };
    (await pc.getStats()).forEach(function (s, _, all) {
      if (s.type === 'inbound-rtp') {
        r[s.kind] = s.bytesReceived || 0;
        if (s.kind === 'video') r.frames = s.framesDecoded || 0;
      }
      if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') {
        if (s.currentRoundTripTime != null) r.rtt = Math.round(s.currentRoundTripTime * 1000);
        var lc = all.get(s.localCandidateId);
        if (lc) r.via = lc.candidateType + '/' + (lc.relayProtocol || lc.protocol);
      }
    });
    return r;
  }

  async function probe(path, cred, stream) {
    var cfg = { iceServers: [{ urls: path.url, username: cred.username, credential: cred.credential }], iceTransportPolicy: 'relay' };
    var a = new RTCPeerConnection(cfg), b = new RTCPeerConnection(cfg);
    var t0 = performance.now();
    var sec = function () { return ((performance.now() - t0) / 1000).toFixed(1); };
    var relay = null, errors = [], states = [];
    a.onicecandidate = function (e) {
      if (!e.candidate) return;
      if (!relay && / typ relay /.test(e.candidate.candidate)) relay = sec();
      b.addIceCandidate(e.candidate).catch(function () {});
    };
    b.onicecandidate = function (e) { if (e.candidate) a.addIceCandidate(e.candidate).catch(function () {}); };
    a.onicecandidateerror = function (e) { if (errors.length < 3) errors.push(e.errorCode + ' ' + (e.errorText || '')); };
    b.oniceconnectionstatechange = function () { states.push(sec() + ' ' + b.iceConnectionState); };
    b.ontrack = function (e) { if (e.track.kind === 'video') peek.srcObject = e.streams[0]; };
    stream.getTracks().forEach(function (t) { a.addTrack(t, stream); });

    log('\n── ' + path.label + ' ──');
    try {
      await a.setLocalDescription(await a.createOffer());
      await b.setRemoteDescription(a.localDescription);
      await b.setLocalDescription(await b.createAnswer());
      await a.setRemoteDescription(b.localDescription);

      var until = performance.now() + CONNECT_S * 1000;
      while (!/connected|completed/.test(b.iceConnectionState) && performance.now() < until) await sleep(200);
      if (!/connected|completed/.test(b.iceConnectionState)) {
        log('НЕ СОЕДИНИЛОСЬ за ' + CONNECT_S + ' с; relay-адрес от сервера: ' + (relay ? 'получен на ' + relay + ' с' : 'не получен') +
          (errors.length ? '; ошибки: ' + errors.join(' | ') : ''));
        return path.label + ': не соединилось' + (relay ? '' : ', сервер недоступен');
      }
      log('соединилось за ' + sec() + ' с');

      // Потолок видео ~1,5 Мбит/с — как у звонка в хорошем качестве.
      a.getSenders().forEach(function (s) {
        if (!s.track || s.track.kind !== 'video') return;
        var p = s.getParameters();
        if (p.encodings && p.encodings[0]) { p.encodings[0].maxBitrate = 1500000; s.setParameters(p).catch(function () {}); }
      });

      var prev = await stats(b), sum = 0, stalls = 0, steps = 0;
      for (var t = STEP_S; t <= TEST_S; t += STEP_S) {
        await sleep(STEP_S * 1000);
        var cur = await stats(b);
        var v = Math.round((cur.video - prev.video) * 8 / STEP_S / 1000);
        var au = Math.round((cur.audio - prev.audio) * 8 / STEP_S / 1000);
        var fps = Math.round((cur.frames - prev.frames) / STEP_S);
        sum += v; steps++;
        if (v < 50) stalls++;
        log(t + ' с: видео ' + v + ' кбит/с, звук ' + au + ', ' + fps + ' кадр/с, rtt ' + (cur.rtt == null ? '?' : cur.rtt) + ' мс, ' + (cur.via || '?') + ', ' + b.iceConnectionState);
        prev = cur;
      }
      var avg = Math.round(sum / steps);
      if (states.length > 2) log('состояния: ' + states.join(', '));
      return path.label + ': ' + (stalls ? 'ЗАМИРАЛО ' + stalls + ' из ' + steps + ' отрезков' : 'стабильно') + ', в среднем ' + avg + ' кбит/с';
    } catch (e) {
      log('сбой: ' + (e && e.message || e));
      return path.label + ': сбой ' + (e && e.message || e);
    } finally {
      a.close(); b.close();
      peek.srcObject = null;
    }
  }

  function send(summary) {
    var net = navigator.connection || {};
    var details = ['сеть браузера: ' + (net.type || '?') + ' / ' + (net.effectiveType || '?'), '— итог —']
      .concat(summary, '— подробно —', lines).slice(0, 120);
    return fetch('/api/client-error', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: location.pathname, name: 'TurnProbe', message: 'Проверка TURN: ' + summary.join('; '), details: details }),
      keepalive: true
    });
  }

  document.getElementById('go').onclick = async function () {
    var btn = this;
    btn.disabled = true;
    lines = [];
    try {
      var r = await fetch('/api/turn-probe', { credentials: 'same-origin' });
      if (r.status === 401) { log('Сначала войдите на сайт, потом откройте эту страницу снова.'); btn.disabled = false; return; }
      if (!r.ok) { log('Проверка на сервере не включена (' + r.status + ').'); btn.disabled = false; return; }
      var cred = await r.json();
      var stream = source();
      var summary = [];
      for (var i = 0; i < cred.paths.length; i++) summary.push(await probe(cred.paths[i], cred, stream));
      stream.getTracks().forEach(function (t) { t.stop(); });
      log('\n══ ИТОГ ══\n' + summary.join('\n'));
      await send(summary);
      log('\nИтог отправлен. Спасибо!');
    } catch (e) {
      log('Сбой проверки: ' + (e && e.message || e));
      btn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
