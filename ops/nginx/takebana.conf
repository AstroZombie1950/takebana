# nginx для Takebana. Ставится скриптом, руками копировать не нужно:
#   sudo bash ops/provision.sh           — конфиг, домен и пути подставляются
#   sudo bash ops/provision.sh --tls     — сертификат
#
# Файл — единственный источник правды для конфигурации. certbot запускается в
# режиме certonly и nginx не редактирует: иначе следующий же запуск provision.sh
# затёр бы его правки этим шаблоном, и nginx остался бы без ssl_certificate.
#
# Скрипт собирает из шаблона один из двух вариантов:
#   сертификата нет  — только блок 80, проксирует на приложение
#   сертификат есть  — блок 80 редиректит на HTTPS, работает блок 443
# Управляют этим метки HTTP_ONLY_BEGIN/END и HTTPS_REDIRECT ниже, не трогайте их.

upstream takebana_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HLS: плейлист переписывается каждые две секунды — кэш на секунду. Не ноль:
# с no-cache CDN за каждым зрителем ходил бы сюда, тысяча зрителей — пятьсот
# запросов в секунду. Сегмент под своим именем не меняется никогда (номера
# от секунд эпохи, utils/hls.js) — кэшируем час. Эти же заголовки берёт CDN.
# map живёт на уровне http, поэтому здесь, а не в location.
map $uri $takebana_hls_cache {
    ~\.m3u8$  "public, max-age=1";
    ~\.ts$    "public, max-age=3600";
    default   "no-store";
}

# Стили и скрипты по исходному адресу (/css/…, /tk-app.js): с ?v=<хеш> —
# год и immutable, без версии — перепроверка по ETag на каждой загрузке.
# Страницы берут сжатые копии из /min/, сюда приходят только запасные пути,
# и год без версии здесь уже подвёл бы: словарь второго языка догружался
# по адресу без версии и после правки остался бы старым у всех.
map $arg_v $takebana_src_cache {
    ""        "no-cache";
    default   "public, max-age=31536000, immutable";
}

# Socket.IO: вебсокету нужен Connection: upgrade, длинному опросу — close.
# Прибитое "upgrade" на обоих ломало бы keepalive у опроса. map — только
# на уровне http, поэтому здесь, а не в location.
map $http_upgrade $takebana_conn {
    default   upgrade;
    ""        close;
}

server {
    listen 80;
    listen [::]:80;
    server_name takebana.com www.takebana.com;

    # Проверка Let's Encrypt всегда идёт по HTTP — и при выпуске, и при продлении.
    # Поэтому location стоит выше редиректа и остаётся в обоих вариантах.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    #HTTP_ONLY_BEGIN
    location / {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }
    #HTTP_ONLY_END
    #HTTPS_REDIRECT: location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2 задаётся параметром listen, а не отдельной директивой: `http2 on`
    # появилась в nginx 1.25.1, а в jammy приезжает 1.18 — она падает с
    # unknown directive. Эта форма понятна обеим линиям.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name takebana.com www.takebana.com;

    ssl_certificate     /etc/letsencrypt/live/takebana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/takebana.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Аватары, галереи и обложки — до 10 МБ на файл, галерея грузится пачкой.
    client_max_body_size 64m;

    # ── Сжатие ────────────────────────────────────────────────────────────────
    # В дистрибутивном nginx.conf стоит `gzip on`, но этого мало по двум
    # причинам: gzip_proxied по умолчанию off, то есть ответы приложения
    # (а через приложение идёт вся разметка) не жмутся вовсе, и gzip_types
    # по умолчанию только text/html — css, js и svg уезжают как есть.
    # Главная — 52 КБ разметки со встроенными стилями, gzip срезает её вчетверо.
    #
    # woff2 в списке нет намеренно: шрифт уже сжат внутри, повторный gzip
    # тратит процессор и прибавляет байты.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/takebana.access.log;
    error_log  /var/log/nginx/takebana.error.log;

    # ── www → апекс ───────────────────────────────────────────────────────────
    # Один канонический адрес. Без этого www и апекс — два разных origin: сессия,
    # выданная на www, не отправляется на takebana.com, а вход через Google
    # возвращает по фиксированному CALLBACKURL на апекс, и начавший на www
    # оказывался залогинен не там, где начинал.
    #
    # Отдельным блоком server сделать нельзя: в варианте без сертификата
    # provision.sh оставляет только первый блок (awk с n < 2), и лишний server
    # молча ломал бы сборку конфига. `if` с одним лишь return — та самая форма,
    # которую документация nginx называет безопасной.
    #
    # Здесь, а не в блоке 80: там `if` перехватил бы и /.well-known/acme-challenge
    # для www, а по нему Let's Encrypt проверяет домен при выпуске по HTTP.
    if ($host = www.takebana.com) {
        return 301 https://takebana.com$request_uri;
    }

    # ── Приложение ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }

    # ── Приложение не отвечает ────────────────────────────────────────────────
    # Перезапуск при выкладке, падение, перегрузка: вместо голого «502 Bad
    # Gateway» nginx — своя страница в оформлении сайта, которая сама
    # перезагрузится, когда приложение поднимется (server/public/errors/50x.html).
    # Свои ответы 5xx приложение рисует само (views/error.ejs): без
    # proxy_intercept_errors nginx их не трогает, срабатывает только на то,
    # что вернул сам, когда до приложения не достучался.
    error_page 502 503 504 /errors/50x.html;
    location = /errors/50x.html {
        root /srv/takebana/server/public;
        internal;
    }

    # Разрешения для MediaMTX (server/routes/venueLive.js): спрашивает только
    # он сам, напрямую с петли. Снаружи адреса нет.
    location = /api/mtx/auth {
        return 404;
    }

    # Видео в галерею профиля — кусками по 8 МБ со страницы загрузки
    # (server/routes/streaming/upload.js): общего предела в 64 МБ хватает,
    # но кусок идёт в приложение потоком, а не копится сначала на диске
    # nginx, и медленной сети дан запас по времени. Прежний приём одним
    # запросом на гигабайты (/profile/gallery/video) убран 21.09.2026.
    location ~ "^/upload/video/[0-9a-f]{24}$" {
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }

    # Вложения переписки — до 200 МБ у видео (server/utils/attachments.js).
    # Так же, как видео галереи: потоком в приложение, с долгим таймаутом.
    location = /messages/attach {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }

    # Файлы исчезающих сообщений отдаёт приложение, а не CDN
    # (server/utils/messageLimit.js): видео до 200 МБ, с перемоткой. Потоком,
    # без буфера на диске nginx, и с таймаутом на долгий просмотр.
    location ~ "^/messages/[0-9a-f]{24}/file$" {
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }

    # ── Socket.IO ─────────────────────────────────────────────────────────────
    # Основной путь — вебсокет: без Upgrade он не установится вообще, а с ним
    # уходят чат, счётчик зрителей, звонки и вся переписка «вживую».
    #
    # Запасной путь — длинный опрос (app.js, transports). Он идёт обычным HTTP
    # по этому же адресу, и ему нужны две вещи: не буферизовать ответ (иначе
    # nginx придержит его у себя и событие опоздает) и отдавать заголовок
    # Connection по $http_upgrade, а не всегда "upgrade": прибитое значение
    # ломало бы keepalive у опроса.
    location /socket.io/ {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $takebana_conn;

        # Опрос держит ответ открытым до события: буфер nginx здесь только мешает.
        proxy_buffering off;

        # Сокет живёт часами: дефолтные 60 секунд рвали бы его постоянно
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
    }

    # ── Камеры заведений: свой приём ─────────────────────────────────────────
    # MediaMTX (ops/mediamtx/) слушает петлю; наружу его выводит nginx, чтобы
    # TLS и сертификат были общие с сайтом. По этим адресам идёт только
    # сигнализация WebRTC — предложение и ответ SDP, по запросу на
    # подключение. Сами звук и видео идут мимо nginx, прямо на порт ICE
    # (8189/udp), и его надо открыть в firewall.
    #
    # Права проверяет приложение: MediaMTX спрашивает его на каждое
    # подключение (authHTTPAddress → /api/mtx/auth), а одноразовый ключ
    # приходит в адресе. Поэтому здесь ничего не проверяется.
    location ^~ /mtx/ {
        proxy_pass http://127.0.0.1:8889/;
        include /etc/nginx/proxy_params_takebana;
        proxy_http_version 1.1;
        # Описание сессии — обычный POST в несколько килобайт; буфер тут
        # только добавляет задержку к началу показа.
        proxy_buffering off;
        proxy_read_timeout 30s;
        access_log off;
    }

    # ── Живое видео: HLS ─────────────────────────────────────────────────────
    # Плейлист и сегменты пишет ffmpeg (server/utils/hls.js) в server/media/live,
    # nginx отдаёт их с диска: ни Node, ни медиасервер в тракте зрителя не
    # участвуют. root, а не alias: /live/<ключ>/index.m3u8 ложится на
    # server/media/live/<ключ>/index.m3u8 без переписывания пути.
    # ^~ — чтобы регулярные location, если появятся, сюда не вмешивались.
    #
    # Лог выключен: каждый зритель берёт плейлист и сегмент раз в две секунды,
    # тысяча зрителей — тысяча строк в секунду, из которых ничего не узнать.
    location ^~ /live/ {
        root /srv/takebana/server/media;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        default_type application/octet-stream;
        add_header Cache-Control $takebana_hls_cache always;
        # Плеер на takebana.com забирает поток с адреса CDN — другой источник,
        # hls.js читает его запросами, и без заголовка браузер ответ не отдаст.
        # Поток и так открыт по адресу, звёздочка ничего не раскрывает.
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── Запасная дорога к записям ────────────────────────────────────────────
    # Тот же файл Bunny, но нашим адресом. Нужна там, где до Bunny не
    # доходит вовсе: 23.09.2026 с российского провайдера (Irtelcom) обе
    # зоны — 185.111.111.155 и .156 — молчали до таймаута, а сам сайт
    # открывался за 257 мс. Режут подсеть Bunny, а не домен, поэтому
    # переезд на свой поддомен 20.09 не помог и помочь не мог.
    #
    # Ходит сюда только тот, у кого CDN уже не открылся: адреса подменяются
    # по cookie tkmedia (server/utils/mediaFallback.js). Для всех остальных
    # ничего не меняется, и трафик остаётся у Bunny.
    #
    # На диск не ложится ничего. proxy_buffering off и особенно
    # proxy_max_temp_file_size 0: без второго nginx складывал бы большой
    # ответ во временный файл, и запись эфира прошла бы через диск. С ним
    # байты идут насквозь — сколько отдали браузеру, столько и взяли.
    #
    # proxy_params_takebana здесь не подключается намеренно: он ставит
    # Host нашего домена, а pull zone по нему ничего не отдаст.
    location ^~ /m/ {
        # Имя — переменной, и это не украшение. Написанное в proxy_pass
        # прямо, оно резолвится один раз при старте: не ответил DNS в этот
        # момент — nginx не поднимается вовсе, и сайт лежит целиком из-за
        # запасной дороги, которой пользуются единицы. С переменной имя
        # разрешается на запросе, и сменивший адреса Bunny не требует
        # перезагрузки. resolver — systemd-resolved, им же на этой машине
        # (Ubuntu 22.04) разрешается всё остальное.
        resolver 127.0.0.53 valid=300s ipv6=off;
        set $tk_vod vod.takebana.com;
        rewrite ^/m/(.*)$ /$1 break;

        proxy_pass https://$tk_vod;
        proxy_set_header Host $tk_vod;
        # У Bunny на одном адресе много доменов: без SNI рукопожатие
        # уходит не туда и отдаёт чужой сертификат.
        proxy_ssl_server_name on;
        proxy_ssl_name $tk_vod;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_max_temp_file_size 0;

        # Сессионная cookie нашего домена Bunny не нужна и не должна туда
        # уезжать. Остальные заголовки идут как есть — в том числе Range,
        # без него не работала бы перемотка по записи.
        proxy_set_header Cookie "";

        # Долгая запись качается долго; обрыв на середине фильма — хуже,
        # чем лишнее соединение.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # Скорость на соединение: 2 МБ/с, это 16 Мбит/с. Часовая запись —
        # около гигабайта, и без потолка несколько зрителей заняли бы
        # канал, которым идут живые эфиры. Потолка хватает и на 1080p,
        # а голосовое с фотографией под ним всё равно приходят разом.
        # Ограничения на число соединений тут нет намеренно: лента
        # открывает десяток картинок сразу, и limit_conn резал бы их.
        proxy_limit_rate 2m;

        # Своего кэша здесь нет намеренно (proxy_cache нигде и не задан):
        # чистить его при удалении записи было бы нечем — purge в
        # utils/storage.js знает только про кэш Bunny, и удалённое
        # сообщение продолжало бы играть с нашего же диска.
        access_log off;
    }

    # ── Подложка карты заведений ─────────────────────────────────────────────
    # Плитки Protomaps одним файлом basemap.pmtiles, шрифты подписей и значки —
    # server/media/basemap, кладёт ops/basemap/fetch.sh. Браузер читает файл
    # плиток кусками (Range) — nginx умеет это для статики сам, gzip не нужен:
    # плитки внутри уже сжаты. Сутки кэша: после обновления подложки pmtiles.js
    # увидит новый ETag и перечитает оглавление файла.
    location ^~ /basemap/ {
        root /srv/takebana/server/media;
        types { application/x-protobuf pbf; application/json json; image/png png; }
        default_type application/octet-stream;
        expires 1d;
        access_log off;
    }

    # ── Статика ───────────────────────────────────────────────────────────────
    # Отдаём с диска мимо Node. Пути должны совпадать с cwd из ops/ecosystem.config.js.
    # Шрифт под своим именем не меняется никогда — год в кэш.
    location /fonts/    { alias /srv/takebana/server/public/fonts/;    expires 1y;  access_log off; }
    location /img/      { alias /srv/takebana/server/public/img/;      expires 30d; access_log off; }
    location /uploads/  { alias /srv/takebana/server/public/uploads/;  expires 7d; }
    # Типы — явно: mime.types у nginx 1.18 не знает .mjs и отдаёт его как
    # application/octet-stream, а модуль с таким типом браузер не исполняет —
    # карта (MapLibre, import() из tk-map.js) падала «Failed to fetch dynamically
    # imported module» (18.09.2026). В vendor лежат только js, mjs и css.
    location /vendor/ {
        alias /srv/takebana/server/public/vendor/;
        types { application/javascript js mjs; text/css css; }
        expires 1y;
        access_log off;
    }

    # Сжатые копии стилей и скриптов с хешем в имени (server/utils/assets.js):
    # правка исходника даёт новое имя, поэтому год и immutable — браузер
    # не пойдёт даже за 304. Было 7d с перепроверкой, PageSpeed на это ругался.
    # add_header, а не expires: immutable в expires не задать, а два
    # Cache-Control в ответе — хуже одного. ^~ — чтобы регулярка для .js
    # ниже сюда не вмешивалась.
    location ^~ /min/ {
        alias /srv/takebana/server/public/min/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Кириллица в копиях живая, не \uXXXX (charset в utils/assets.js):
        # кодировку объявляем явно, а не надеемся на кодировку страницы.
        charset utf-8;
        charset_types text/css application/javascript text/javascript;
        access_log off;
    }

    # Исходники — только запасной путь (см. $takebana_src_cache выше).
    location /css/ {
        alias /srv/takebana/server/public/css/;
        add_header Cache-Control $takebana_src_cache;
        access_log off;
    }

    # Скрипты лежат в корне public/, поэтому не префиксом, а регуляркой.
    # /socket.io/socket.io.js под неё не попадает: там слэш в середине,
    # а [\w.-] его не берёт — раздача сокета остаётся на своём location.
    location ~* ^/[\w.-]+\.js$ {
        root /srv/takebana/server/public;
        add_header Cache-Control $takebana_src_cache;
        access_log off;
    }
}
