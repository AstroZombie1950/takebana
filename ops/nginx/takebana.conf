# nginx для Takebana. Применяется в день переезда:
#   sudo cp ops/nginx/takebana.conf /etc/nginx/sites-available/takebana
#   sudo ln -s /etc/nginx/sites-available/takebana /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат — certbot: sudo certbot --nginx -d takebana.com -d www.takebana.com
# (certbot сам допишет ssl_certificate и редирект с 80 порта).

upstream takebana_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Медиасервер: HTTP-FLV и HLS отдаёт node-media-server напрямую.
upstream takebana_media {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name takebana.com www.takebana.com;

    # До выпуска сертификата — просто прокси. После certbot тут будет редирект на 443.
    location / {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name takebana.com www.takebana.com;

    # ssl_certificate / ssl_certificate_key допишет certbot

    # Аватары, галереи и обложки — до 10 МБ на файл, галерея грузится пачкой.
    client_max_body_size 64m;

    access_log /var/log/nginx/takebana.access.log;
    error_log  /var/log/nginx/takebana.error.log;

    # ── Приложение ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }

    # ── Socket.IO ─────────────────────────────────────────────────────────────
    # Приложение поднимает io с transports: ['websocket'] — без Upgrade
    # соединение не установится вообще: ни чата, ни счётчика зрителей, ни звонков.
    location /socket.io/ {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Сокет живёт часами: дефолтные 60 секунд рвали бы его постоянно
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
    }

    # ── Живое видео: HTTP-FLV и HLS ──────────────────────────────────────────
    # Идёт мимо приложения, прямо на медиасервер: у Express на /live стоит
    # собственный прокси, и гонять поток через Node незачем.
    #
    # proxy_buffering off обязателен: FLV — одно бесконечное соединение,
    # с буферизацией зритель получает видео с задержкой в несколько секунд
    # или не получает вовсе.
    location /live/ {
        proxy_pass http://takebana_media;
        include /etc/nginx/proxy_params_takebana;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        add_header Cache-Control "no-store" always;
    }

    # Плейлисты HLS не кэшируем (обновляются каждые пару секунд),
    # сегменты кэшируем: они неизменны.
    location ~* \.m3u8$ {
        proxy_pass http://takebana_media;
        include /etc/nginx/proxy_params_takebana;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.ts$ {
        proxy_pass http://takebana_media;
        include /etc/nginx/proxy_params_takebana;
        expires 1h;
    }

    # ── Статика ───────────────────────────────────────────────────────────────
    # Отдаём с диска мимо Node. Пути должны совпадать с cwd из ops/ecosystem.config.js.
    location /img/      { alias /srv/takebana/server/public/img/;      expires 30d; access_log off; }
    location /css/      { alias /srv/takebana/server/public/css/;      expires 7d;  access_log off; }
    location /uploads/  { alias /srv/takebana/server/public/uploads/;  expires 7d; }
}
