# nginx для Takebana. Ставится скриптом, руками копировать не нужно:
#   sudo bash ops/provision.sh           — конфиг, домен и пути подставляются
#   sudo bash ops/provision.sh --tls     — сертификат
#
# Файл — единственный источник правды для конфигурации. certbot запускается в
# режиме certonly и nginx не редактирует: иначе следующий же запуск provision.sh
# затёр бы его правки этим шаблоном, и nginx остался бы без ssl_certificate.
#
# Скрипт собирает из шаблона один из двух вариантов:
#   сертификата нет  — только блок 80, проксирует на приложение
#   сертификат есть  — блок 80 редиректит на HTTPS, работает блок 443
# Управляют этим метки HTTP_ONLY_BEGIN/END и HTTPS_REDIRECT ниже, не трогайте их.

upstream takebana_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HLS: плейлист переписывается каждые две секунды — не кэшируем; сегмент под
# своим именем не меняется никогда — кэшируем. Эти же заголовки возьмёт CDN.
# map живёт на уровне http, поэтому здесь, а не в location.
map $uri $takebana_hls_cache {
    ~\.m3u8$  "no-cache";
    ~\.ts$    "public, max-age=3600";
    default   "no-store";
}

server {
    listen 80;
    listen [::]:80;
    server_name takebana.com www.takebana.com;

    # Проверка Let's Encrypt всегда идёт по HTTP — и при выпуске, и при продлении.
    # Поэтому location стоит выше редиректа и остаётся в обоих вариантах.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    #HTTP_ONLY_BEGIN
    location / {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }
    #HTTP_ONLY_END
    #HTTPS_REDIRECT: location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2 задаётся параметром listen, а не отдельной директивой: `http2 on`
    # появилась в nginx 1.25.1, а в jammy приезжает 1.18 — она падает с
    # unknown directive. Эта форма понятна обеим линиям.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name takebana.com www.takebana.com;

    ssl_certificate     /etc/letsencrypt/live/takebana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/takebana.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Аватары, галереи и обложки — до 10 МБ на файл, галерея грузится пачкой.
    client_max_body_size 64m;

    # ── Сжатие ────────────────────────────────────────────────────────────────
    # В дистрибутивном nginx.conf стоит `gzip on`, но этого мало по двум
    # причинам: gzip_proxied по умолчанию off, то есть ответы приложения
    # (а через приложение идёт вся разметка) не жмутся вовсе, и gzip_types
    # по умолчанию только text/html — css, js и svg уезжают как есть.
    # Главная — 52 КБ разметки со встроенными стилями, gzip срезает её вчетверо.
    #
    # woff2 в списке нет намеренно: шрифт уже сжат внутри, повторный gzip
    # тратит процессор и прибавляет байты.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/takebana.access.log;
    error_log  /var/log/nginx/takebana.error.log;

    # ── www → апекс ───────────────────────────────────────────────────────────
    # Один канонический адрес. Без этого www и апекс — два разных origin: сессия,
    # выданная на www, не отправляется на takebana.com, а вход через Google
    # возвращает по фиксированному CALLBACKURL на апекс, и начавший на www
    # оказывался залогинен не там, где начинал.
    #
    # Отдельным блоком server сделать нельзя: в варианте без сертификата
    # provision.sh оставляет только первый блок (awk с n < 2), и лишний server
    # молча ломал бы сборку конфига. `if` с одним лишь return — та самая форма,
    # которую документация nginx называет безопасной.
    #
    # Здесь, а не в блоке 80: там `if` перехватил бы и /.well-known/acme-challenge
    # для www, а по нему Let's Encrypt проверяет домен при выпуске по HTTP.
    if ($host = www.takebana.com) {
        return 301 https://takebana.com$request_uri;
    }

    # ── Приложение ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;
    }

    # ── Socket.IO ─────────────────────────────────────────────────────────────
    # Приложение поднимает io с transports: ['websocket'] — без Upgrade
    # соединение не установится вообще: ни чата, ни счётчика зрителей, ни звонков.
    location /socket.io/ {
        proxy_pass http://takebana_app;
        include /etc/nginx/proxy_params_takebana;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Сокет живёт часами: дефолтные 60 секунд рвали бы его постоянно
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
    }

    # ── Живое видео: HLS ─────────────────────────────────────────────────────
    # Плейлист и сегменты пишет ffmpeg (server/utils/hls.js) в server/media/live,
    # nginx отдаёт их с диска: ни Node, ни медиасервер в тракте зрителя не
    # участвуют. root, а не alias: /live/<ключ>/index.m3u8 ложится на
    # server/media/live/<ключ>/index.m3u8 без переписывания пути.
    # ^~ — чтобы регулярные location, если появятся, сюда не вмешивались.
    #
    # Лог выключен: каждый зритель берёт плейлист и сегмент раз в две секунды,
    # тысяча зрителей — тысяча строк в секунду, из которых ничего не узнать.
    location ^~ /live/ {
        root /srv/takebana/server/media;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        default_type application/octet-stream;
        add_header Cache-Control $takebana_hls_cache always;
        access_log off;
    }

    # ── Статика ───────────────────────────────────────────────────────────────
    # Отдаём с диска мимо Node. Пути должны совпадать с cwd из ops/ecosystem.config.js.
    # Шрифт под своим именем не меняется никогда — год в кэш.
    location /fonts/    { alias /srv/takebana/server/public/fonts/;    expires 1y;  access_log off; }
    location /img/      { alias /srv/takebana/server/public/img/;      expires 30d; access_log off; }
    location /css/      { alias /srv/takebana/server/public/css/;      expires 7d;  access_log off; }
    location /uploads/  { alias /srv/takebana/server/public/uploads/;  expires 7d; }
}
