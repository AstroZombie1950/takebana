# MediaMTX — приёмник камер заведений (23.09.2026, с 25.09 — только приёмник).
#
# Заведение вещает сюда по WHIP. Зрителям MediaMTX не отдаёт ничего
# (решение 25.09: наш канал — 16 ТБ в месяц — на раздачу не тратим):
# поток с петли по RTSP забирает наш ffmpeg, кладёт знак в кадр и режет
# HLS 480p/15 кадров в server/media/live — зрители берут его через Bunny,
# как эфиры (server/utils/venueCam.js). Наш исходящий трафик — одна копия
# на камеру, которую смотрят; вещает камера только при зрителях.
#
# Установка и запуск — ops/mediamtx/README.md.

logLevel: info
logDestinations: [stdout]

# API нужен приложению: какие камеры вещают (после его перезапуска) и
# закрыть вещателя (server/utils/mediamtx.js). Наружу не выставляется —
# слушает только петлю.
api: yes
apiAddress: 127.0.0.1:9997

# Права спрашиваем у приложения: MediaMTX никого не знает, а «кто владелец
# заведения» живёт в базе. Читать приложение пускает только свой ffmpeg. На каждое подключение
# приложение получает POST и отвечает 200 или 401 (routes/venueLive.js).
authMethod: http
authHTTPAddress: http://127.0.0.1:3000/api/mtx/auth
# Своё же обращение к API по петле не гоняем через приложение.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# WebRTC — приём по WHIP. RTSP — только для нашего ffmpeg: слушает петлю,
# только TCP (UDP-портов RTP не открывает). Читать по WebRTC (WHEP)
# приложение не разрешает никому (/api/mtx/auth). Остальное выключено.
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: no
srt: no
# Свой HLS не нужен: ему нужен H.264 из браузера и знак в кадр он не
# положит — HLS режет наш ffmpeg (server/utils/hls.js, профиль venue).
hls: no

webrtc: yes
# TLS снимает nginx, сюда приходит уже расшифрованное с петли.
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no
webrtcAllowOrigins: ['https://takebana.com']
webrtcTrustedProxies: [127.0.0.1]
# Порт ICE открыт в firewall: по нему идут сами звук и видео.
webrtcLocalUDPAddress: :8189
# Публичный адрес сервера: клиенту нужно знать, куда слать медиа.
# Заполняется при установке (ops/mediamtx/README.md).
webrtcAdditionalHosts: []

# Пути заводятся на лету: venue_<id> — камера заведения. Имена проверяет
# приложение в хуке прав, здесь достаточно общего правила.
pathDefaults:
  source: publisher
  # Никаких записей: камера заведения — это «что сейчас», а не архив.
  record: no
  # Публикация пошла и кончилась — приложение запускает и гасит ffmpeg
  # (routes/venueLive.js, только с петли). Порт — тот же, что у authHTTPAddress.
  runOnAvailable: curl -s -X POST http://127.0.0.1:3000/api/mtx/available?path=$MTX_PATH
  runOnUnavailable: curl -s -X POST http://127.0.0.1:3000/api/mtx/unavailable?path=$MTX_PATH

paths:
  all_others:
