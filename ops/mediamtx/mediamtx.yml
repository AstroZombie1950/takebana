# MediaMTX — свой приём камер заведений (23.09.2026).
#
# Камера заведения перестала быть комнатой Daily: заведение вещает один раз
# по WHIP, зрители забирают по WHEP. Платим только за трафик — по расчёту
# в server/views/calc.html это $864 в месяц против $18 144 на том же
# сценарии, а мост через выход RTMP Daily стоил бы $4 104 независимо
# от числа зрителей.
#
# Перекодирования здесь нет вовсе: браузер отдаёт H.264 сразу в нужном виде,
# MediaMTX перекладывает его в WHEP и HLS как есть. Поэтому ограничение
# ffmpeg 4.4 на сервере к этому пути не относится, и двадцать камер
# не упираются в процессор.
#
# Установка и запуск — ops/mediamtx/README.md.

logLevel: info
logDestinations: [stdout]

# API нужен приложению: по нему оно узнаёт, идёт ли камера и сколько
# человек её смотрят (server/utils/mediamtx.js). Наружу не выставляется —
# слушает только петлю.
api: yes
apiAddress: 127.0.0.1:9997

# Права спрашиваем у приложения: MediaMTX никого не знает, а «кто владелец
# заведения» и «кому можно смотреть» живёт в базе. На каждое подключение
# приложение получает POST и отвечает 200 или 401 (routes/venueLive.js).
authMethod: http
authHTTPAddress: http://127.0.0.1:3000/api/mtx/auth
# Своё же обращение к API по петле не гоняем через приложение.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# Нужен только WebRTC: приём по WHIP, раздача по WHEP. Всё остальное
# выключено — лишние слушающие порты на сервере не нужны.
rtsp: no
rtmp: no
srt: no
# HLS — ветка на вырост: когда зрителей станет больше, чем тянет наш канал
# (16 ТБ в месяц), камера поедет на Bunny через этот выход. Пока выключен:
# задержка у него 10–15 секунд против меньше секунды у WHEP.
hls: no

webrtc: yes
# TLS снимает nginx, сюда приходит уже расшифрованное с петли.
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no
webrtcAllowOrigins: ['https://takebana.com']
webrtcTrustedProxies: [127.0.0.1]
# Порт ICE открыт в firewall: по нему идут сами звук и видео.
webrtcLocalUDPAddress: :8189
# Публичный адрес сервера: клиенту нужно знать, куда слать медиа.
# Заполняется при установке (ops/mediamtx/README.md).
webrtcAdditionalHosts: []

# Пути заводятся на лету: venue_<id> — камера заведения. Имена проверяет
# приложение в хуке прав, здесь достаточно общего правила.
pathDefaults:
  source: publisher
  # Никаких записей: камера заведения — это «что сейчас», а не архив.
  record: no

paths:
  all_others:
