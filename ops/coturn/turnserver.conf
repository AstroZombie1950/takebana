# coturn — свой TURN для звонков из сетей, где провайдер душит Daily.
# На сервере: /etc/turnserver.conf. Пока только для проверки
# (server/routes/turnProbe.js, public/turn-probe.html).
#
# Ключи временные: сайт выдаёт их по TURN REST API, секрет общий с .env
# (TURN_SECRET). Постоянных пользователей здесь нет.

listening-port=3478
tls-listening-port=5349
# У takebana.com есть и A, и AAAA: браузер может прийти по IPv6.
# Оба адреса висят прямо на интерфейсе (NAT нет), поэтому external-ip не нужен.
listening-ip=187.77.78.56
listening-ip=2a02:4780:79:40a5::1
relay-ip=187.77.78.56
relay-ip=2a02:4780:79:40a5::1
# Порты ретрансляции — те же, что открыты в ufw.
min-port=49160
max-port=49400

realm=takebana.com
use-auth-secret
static-auth-secret=__TURN_SECRET__
fingerprint

# Сертификат сайта: копия из Let's Encrypt, которую читает пользователь
# turnserver (/etc/letsencrypt/live закрыт для всех, кроме root).
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1

# Сервер — ретранслятор только наружу. Без этого через TURN можно
# достучаться до MongoDB на 127.0.0.1 и прочего внутреннего.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Потолки: на одного пользователя и на весь сервер (канал 1 Гбит/с
# делим с сайтом и эфирами).
user-quota=12
total-quota=400
# max-bps — в байтах: ~8 Мбит/с на сессию, звонку хватает с запасом.
max-bps=1000000
stale-nonce=600

no-cli
syslog
simple-log
